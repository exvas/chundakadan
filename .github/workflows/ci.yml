
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-chundakadan-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # crenya's shared Frappe CI: own ports + bench per job on crenya-ci, a saved Frappe/ERPNext site,
  # fails when no tests ran. One fix there reaches every app.
  tests:
    uses: exvas/ci-workflows/.github/workflows/frappe-app.yml@v1
    with:
      app: chundakadan
      frappe_versions: '["version-15"]'
      draft_frappe_versions: '["version-15"]'
      hrms: true
      runs_on: '"ubuntu-latest"'
      # What production runs, because that is what this app is written
      # against. Frappe walks every link field while building test
      # records, so a missing app is not a missing feature here — it is
      # no tests at all:
      #   payments          — owns Payment Gateway, which erpnext's own
      #                       Payment Gateway Account links to
      #   india_compliance  — doc_events/address_gst.py imports it, and
      #                       the GST fields on every invoice are its own
      #   field_sales       — owns Cheque Bounce and Chundakadan Settings
      extra_apps: |
        payments https://github.com/frappe/payments
        india_compliance https://github.com/resilient-tech/india-compliance
        field_sales https://github.com/exvas/field_sales main

  # TEMPORARY: the shared CI only reports an exit code, and its log needs a
  # token this session does not have. This job runs the same install and test
  # and puts the traceback into a GitHub annotation, which is readable without
  # one. Reverted before merge.
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis-cache:
        image: redis:alpine
        ports: ['6379']
      redis-queue:
        image: redis:alpine
        ports: ['6379']
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306']
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - name: Ports and bench
        run: |
          {
            echo "DB_PORT=${{ job.services.mariadb.ports['3306'] }}"
            echo "REDIS_CACHE_PORT=${{ job.services.redis-cache.ports['6379'] }}"
            echo "REDIS_QUEUE_PORT=${{ job.services.redis-queue.ports['6379'] }}"
            echo "BENCH=$RUNNER_TEMP/frappe-bench"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Packages
        run: sudo apt-get -o DPkg::Lock::Timeout=600 install -y -qq mariadb-client
      - name: Bench and site
        run: |
          set -euo pipefail
          pip install -q frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-15 --python "$(which python)" "$BENCH"
          mariadb --host 127.0.0.1 --port "$DB_PORT" -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          cd "$BENCH"
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port "$DB_PORT"
          bench set-config -g redis_cache "redis://127.0.0.1:$REDIS_CACHE_PORT"
          bench set-config -g redis_queue "redis://127.0.0.1:$REDIS_QUEUE_PORT"
          bench set-config -g redis_socketio "redis://127.0.0.1:$REDIS_QUEUE_PORT"
          bench get-app --branch version-15 erpnext
          bench get-app --branch version-15 hrms
          bench get-app --branch version-15 payments https://github.com/frappe/payments
          bench get-app --branch version-15 india_compliance https://github.com/resilient-tech/india-compliance
          bench get-app --branch main field_sales https://github.com/exvas/field_sales
          bench get-app chundakadan "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-host 127.0.0.1 --db-port "$DB_PORT" --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app hrms
          bench --site test_site install-app payments
          bench --site test_site install-app india_compliance
          bench --site test_site install-app field_sales
          bench --site test_site install-app chundakadan
          bench --site test_site set-config allow_tests true
          bench --site test_site execute erpnext.setup.utils.before_tests
      - name: Tests, with the failure annotated
        working-directory: ${{ env.BENCH }}
        run: |
          set +e
          bench --site test_site run-tests --app chundakadan > "$RUNNER_TEMP/out.log" 2>&1
          code=$?
          tail -c 4000 "$RUNNER_TEMP/out.log"
          [ $code -eq 0 ] && exit 0
          enc() { python3 -c "import sys; t = sys.stdin.read(); print(t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"; }
          grep -E '^(FAIL|ERROR): ' "$RUNNER_TEMP/out.log" | sed 's/.*(\(.*\))$/\1/' | sort | uniq -c | sort -rn > "$RUNNER_TEMP/classes.txt"
          echo "::error title=failing classes::$(enc < "$RUNNER_TEMP/classes.txt")"
          grep -E '^(FAIL|ERROR): ' "$RUNNER_TEMP/out.log" | sed 's/ (.*//' > "$RUNNER_TEMP/names.txt"
          split -l 25 "$RUNNER_TEMP/names.txt" "$RUNNER_TEMP/chunk."
          i=0
          for f in "$RUNNER_TEMP"/chunk.*; do
            i=$((i+1))
            echo "::error title=failing tests $i::$(enc < "$f")"
          done
          echo "::error title=tail::$(tail -c 2500 "$RUNNER_TEMP/out.log" | enc)"
          exit 1
