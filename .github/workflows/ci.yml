
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-chundakadan-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # crenya's shared Frappe CI: own ports + bench per job on crenya-ci, a saved Frappe/ERPNext site,
  # fails when no tests ran. One fix there reaches every app.
  tests:
    uses: exvas/ci-workflows/.github/workflows/frappe-app.yml@v1
    with:
      app: chundakadan
      frappe_versions: '["version-15"]'
      draft_frappe_versions: '["version-15"]'
      hrms: true
      runs_on: '"ubuntu-latest"'
      # Both are needed before a single test can run, because Frappe walks
      # every link field while building test records:
      #   field_sales — owns Cheque Bounce, which Post Dated Cheque links to
      #                 and hooks.py hooks into
      #   payments    — owns Payment Gateway, which erpnext's own Payment
      #                 Gateway Account links to
      extra_apps: |
        payments https://github.com/frappe/payments
        field_sales https://github.com/exvas/field_sales main
