
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-chundakadan-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # crenya's shared Frappe CI: own ports + bench per job on crenya-ci, a saved Frappe/ERPNext site,
  # fails when no tests ran. One fix there reaches every app.
  tests:
    uses: exvas/ci-workflows/.github/workflows/frappe-app.yml@v1
    with:
      app: chundakadan
      frappe_versions: '["version-15"]'
      draft_frappe_versions: '["version-15"]'
      hrms: true
      runs_on: '"ubuntu-latest"'
      # field_sales owns the Cheque Bounce doctype this app links to and
      # hooks into, so without it Frappe's test bootstrap cannot resolve
      # Post Dated Cheque's link field and no test runs at all.
      extra_apps: |
        field_sales https://github.com/exvas/field_sales main
