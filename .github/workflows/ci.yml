
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-chundakadan-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # crenya's shared Frappe CI: own ports + bench per job on crenya-ci, a saved Frappe/ERPNext site,
  # fails when no tests ran. One fix there reaches every app.
  tests:
    uses: exvas/ci-workflows/.github/workflows/frappe-app.yml@v1
    with:
      app: chundakadan
      frappe_versions: '["version-15"]'
      draft_frappe_versions: '["version-15"]'
      hrms: true
      runs_on: '"ubuntu-latest"'
      # What production runs, because that is what this app is written
      # against. Frappe walks every link field while building test
      # records, so a missing app is not a missing feature here — it is
      # no tests at all:
      #   payments          — owns Payment Gateway, which erpnext's own
      #                       Payment Gateway Account links to
      #   india_compliance  — doc_events/address_gst.py imports it, and
      #                       the GST fields on every invoice are its own
      #   field_sales       — owns Cheque Bounce and Chundakadan Settings
      extra_apps: |
        payments https://github.com/frappe/payments
        india_compliance https://github.com/resilient-tech/india-compliance
        field_sales https://github.com/exvas/field_sales main
